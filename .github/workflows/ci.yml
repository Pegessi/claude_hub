name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run black (formatting check)
        run: uv run black --check .
      - name: Run isort (import order check)
        run: uv run isort --check .
      - name: Run mypy (type check)
        run: uv run mypy .
      - name: Run pytest (tests)
        run: uv run pytest -xvs --ignore=tests/test_terminal_replay.py --cov=claude_hub --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  repo-docs:
    name: Repo hygiene & docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify AGENTS.md and CLAUDE.md stay in sync
        run: |
          if ! diff -q AGENTS.md CLAUDE.md >/dev/null 2>&1; then
            echo "::error::AGENTS.md and CLAUDE.md differ. These files must remain byte-identical. Update both in the same commit."
            diff AGENTS.md CLAUDE.md || true
            exit 1
          fi
          echo "✓ AGENTS.md == CLAUDE.md"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Cache pnpm packages
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install
      - name: Run ESLint (linting)
        run: pnpm run lint:check
      # TODO(T1): no coverage until Vitest is set up — see frontend/package.json test:unit TODO.
      - name: Run unit tests
        run: pnpm run test:unit
      - name: Run Type check and build
        run: pnpm run build

  ttyd:
    name: Verify ttyd & tmux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install ttyd
        run: |
          wget -qO ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          chmod +x ttyd
          sudo mv ttyd /usr/local/bin/
      - name: Verify tmux installation
        run: tmux -V
      - name: Verify ttyd installation
        run: ttyd --version
      - name: Test tmux session creation
        run: |
          # Test creating a detached tmux session
          tmux new-session -d -s test-session "sleep 30"
          # Verify the session exists
          tmux has-session -t test-session
          # Clean up
          tmux kill-session -t test-session
          echo "✓ tmux session test passed"
      - name: Test ttyd can start (dry run)
        run: |
          # Test that ttyd can start without errors (with --help)
          ttyd --help > /dev/null
          echo "✓ ttyd basic functionality test passed"

  terminal-e2e:
    name: Terminal E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install ttyd
        run: |
          wget -qO ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          chmod +x ttyd
          sudo mv ttyd /usr/local/bin/
      - name: Run terminal replay tests
        # Heavy browser-driven e2e tests are sensitive to CI resource
        # contention: on shared runners, CPU starvation slows xterm.js
        # rendering and tmux/ttyd startup enough to blow past the fixed
        # wait deadlines (mostly 12s) that pass comfortably on a laptop.
        # CLAUDE_HUB_E2E_TIMEOUT_SCALE multiplies every Playwright deadline
        # and tmux setup poll budget so the slowness is tolerated instead of
        # failing deterministically. One rerun still absorbs a rare transient
        # flake without ballooning the job into reruns-of-everything.
        env:
          CLAUDE_HUB_E2E_TIMEOUT_SCALE: "3"
        run: uv run pytest tests/test_terminal_replay.py -v --reruns 1 --reruns-delay 5

  security-audit:
    name: Security audit (informational only — never fails the pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Python side ----------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Cache uv packages (security-audit)
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-security-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install backend deps
        working-directory: ./backend
        run: uv sync --extra dev

      - name: Run Bandit (Python SAST)
        working-directory: ./backend
        # || true — many Bandit warnings are false positives in terminal /
        # file-management code. We want the report visible, not a red CI.
        run: |
          uv run pip install bandit
          uv run bandit -r claude_hub -f txt -o bandit-report.txt || true

      # TODO(PY-AUDIT): uv does not yet expose a first-class `uv audit` subcommand.
      # Once https://github.com/astral-sh/uv/issues/XXXX (CVE audit) ships, replace
      # this note with `uv audit` (or `uv tool run pip-audit`) as a real step.
      - name: Run uv audit (Python deps) — stubbed, informational
        run: echo "Skipping Python dep CVE audit — uv does not expose a first-class audit subcommand yet."

      # --- JS side --------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Cache pnpm packages (security-audit)
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-security-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install frontend deps
        working-directory: ./frontend
        run: pnpm install

      - name: Run pnpm audit (production deps)
        working-directory: ./frontend
        # || true — keep CI green while the team triages any upstream advisories.
        run: pnpm audit --prod --audit-level high || true

      # --- Artifacts ------------------------------------------------------
      - name: Upload Bandit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.txt
          if-no-files-found: ignore
