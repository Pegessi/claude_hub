name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend-format
            label: format
          - target: backend-types
            label: mypy (all files)
          - target: backend-tests
            label: pytest
    steps:
      - uses: actions/checkout@v4
      - id: uv-version
        name: Read declared uv version
        run: echo "version=$(tr -d '[:space:]' < .uv-version)" >> "$GITHUB_OUTPUT"
      - name: Set up declared Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-test-version
      - name: Set up declared uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev --python "$(cat ../.python-test-version)"
      - name: Run unified backend check
        run: ./scripts/verify.sh ${{ matrix.target }}
      - name: Upload backend coverage to Codecov
        if: matrix.target == 'backend-tests'
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  repo-docs:
    name: Repo hygiene & docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify document invariants
        run: ./scripts/verify.sh docs

  frontend:
    name: Frontend / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: frontend-lint
            label: lint
          - target: frontend-types
            label: typecheck
          - target: frontend-tests
            label: node tests
          - target: frontend-build
            label: bundle
    steps:
      - uses: actions/checkout@v4
      - name: Install declared pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Set up declared Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-test-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      - name: Run unified frontend check
        run: ./scripts/verify.sh ${{ matrix.target }}

  ttyd:
    name: Verify ttyd & tmux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install ttyd
        run: |
          wget -qO ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          chmod +x ttyd
          sudo mv ttyd /usr/local/bin/
      - name: Verify tmux installation
        run: tmux -V
      - name: Verify ttyd installation
        run: ttyd --version
      - name: Test tmux session creation
        run: |
          # Test creating a detached tmux session
          tmux new-session -d -s test-session "sleep 30"
          # Verify the session exists
          tmux has-session -t test-session
          # Clean up
          tmux kill-session -t test-session
          echo "✓ tmux session test passed"
      - name: Test ttyd can start (dry run)
        run: |
          # Test that ttyd can start without errors (with --help)
          ttyd --help > /dev/null
          echo "✓ ttyd basic functionality test passed"

  terminal-e2e:
    name: Terminal E2E (Playwright)
    runs-on: ubuntu-latest
    # These were long treated as runner flakiness and left non-blocking. They
    # were in fact failing deterministically for two reasons, both fixed:
    # the tmux pane was re-wrapped at a different width than the one the
    # browser rendered, so history could never match; and four tabs asked for
    # /bin/zsh, which no runner has. The suite now passes locally at
    # CLAUDE_HUB_E2E_TIMEOUT_SCALE=1, so it gates main again.
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-test-version
      - id: uv-version
        name: Read declared uv version
        run: echo "version=$(tr -d '[:space:]' < .uv-version)" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ steps.uv-version.outputs.version }}
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync --frozen --extra dev --python "$(cat ../.python-test-version)"
      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install ttyd
        run: |
          wget -qO ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          chmod +x ttyd
          sudo mv ttyd /usr/local/bin/
      - name: Run terminal replay tests
        # Shared runners are slower than a developer machine, so every
        # Playwright deadline and tmux poll budget is still scaled up. One
        # rerun absorbs a rare transient flake; it is no longer compensating
        # for a deterministic failure.
        env:
          CLAUDE_HUB_E2E_TIMEOUT_SCALE: "3"
        run: uv run pytest tests/test_terminal_replay.py -v --reruns 1 --reruns-delay 5

  security-audit:
    name: Security audit (informational only — never fails the pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Python side ----------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-test-version
      - id: uv-version
        name: Read declared uv version
        run: echo "version=$(tr -d '[:space:]' < .uv-version)" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ steps.uv-version.outputs.version }}
      - name: Cache uv packages (security-audit)
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-security-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install backend deps
        working-directory: ./backend
        run: uv sync --frozen --extra dev --python "$(cat ../.python-test-version)"

      - name: Run Bandit (Python SAST)
        working-directory: ./backend
        # || true — many Bandit warnings are false positives in terminal /
        # file-management code. We want the report visible, not a red CI.
        run: |
          uv run pip install bandit
          uv run bandit -r claude_hub -f txt -o bandit-report.txt || true

      # TODO(PY-AUDIT): uv does not yet expose a first-class `uv audit` subcommand.
      # Once https://github.com/astral-sh/uv/issues/XXXX (CVE audit) ships, replace
      # this note with `uv audit` (or `uv tool run pip-audit`) as a real step.
      - name: Run uv audit (Python deps) — stubbed, informational
        run: echo "Skipping Python dep CVE audit — uv does not expose a first-class audit subcommand yet."

      # --- JS side --------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-test-version
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Cache pnpm packages (security-audit)
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-security-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install frontend deps
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (production deps)
        working-directory: ./frontend
        # || true — keep CI green while the team triages any upstream advisories.
        run: pnpm audit --prod --audit-level high || true

      # --- Artifacts ------------------------------------------------------
      - name: Upload Bandit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.txt
          if-no-files-found: ignore
