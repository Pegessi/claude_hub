[project]
name = "claude-hub"
version = "0.1.0"
description = "Persistent Claude/Codex terminal and Agent Workspace dashboard"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "websockets>=16.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.1.0",
    "playwright>=1.60.0",
    "pytest-playwright>=0.8.0",
    "pytest-rerunfailures>=16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The workspace_manager package is one logical class split into method-group
# mixins for maintainability. Cross-mixin ``self.*`` calls and returns cannot be
# resolved statically per-submodule, so mypy emits false-positive ``attr-defined``
# / ``no-any-return`` on the submodules only. The composed ``WorkspaceManager``
# class and every caller in ``__init__`` remain fully type-checked.
[[tool.mypy.overrides]]
module = "claude_hub.services.workspace_manager.*"
disable_error_code = ["attr-defined", "no-any-return"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20260518",
]
