[project]
name = "claude-hub"
version = "0.1.0"
description = "Persistent Claude/Codex terminal and Agent Workspace dashboard"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
    "httpx[socks]>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "click>=8.5.1",
    "lark-oapi==1.8.0",
    "markdown-it-py>=4.3.0,<5",
]

[project.scripts]
claude-hub = "claude_hub.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "black>=26.10.1",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "playwright>=1.65.2",
    "pytest-playwright>=0.10.0",
    "pytest-rerunfailures>=16.7",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
plugins = ["pydantic.mypy"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../scripts/task-graph-e2e"
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
# Recognize runtime defaults without weakening constructor type/field checks.
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
# Report existing timing data; this is diagnostic output, not a timing gate.
addopts = "--durations=10 --durations-min=1.0"
# Emit actionable stacks for stalled tests without bypassing fixture cleanup.
faulthandler_timeout = 60
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = [
    "ignore:websockets.InvalidStatusCode is deprecated:DeprecationWarning:lark_oapi.ws.client",
    "ignore:websockets.legacy is deprecated.*:DeprecationWarning:websockets.legacy",
    "error::pydantic.warnings.PydanticDeprecatedSince20",
    "error:Duplicate Operation ID.*:UserWarning",
    "error:Setting per-request cookies=.*:DeprecationWarning",
]
markers = [
    "flaky(reruns, reruns_delay): rerun flaky integration tests",
]

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20261030",
]
