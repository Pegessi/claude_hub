[project]
name = "claude-hub"
version = "0.1.0"
description = "Persistent Claude/Codex terminal and Agent Workspace dashboard"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "click>=8.1.0",
    "lark-oapi>=1.6.8",
]

[project.scripts]
claude-hub = "claude_hub.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "mypy>=1.11.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "pytest-rerunfailures>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The workspace_manager package is one logical class split into method-group
# mixins for maintainability. Cross-mixin ``self.*`` calls and returns cannot be
# resolved statically per-submodule, so mypy emits false-positive ``attr-defined``
# / ``no-any-return`` on the submodules only. The composed ``WorkspaceManager``
# class and every caller in ``__init__`` remain fully type-checked.
[[tool.mypy.overrides]]
module = "claude_hub.services.workspace_manager.*"
disable_error_code = ["attr-defined", "no-any-return"]

# lark-oapi ships no type stubs; it is imported lazily inside the feishu bot.
[[tool.mypy.overrides]]
module = "lark_oapi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20260408",
]
