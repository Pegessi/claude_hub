version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8173:8173"
    environment:
      - FRONTEND_URL=http://localhost:5173
      # The frontend preview container serves a DIFFERENT origin
      # (http://localhost:5173) than the backend (:8173), so browser
      # terminal WebSockets and unsafe HTTP writes must whitelist it.
      - CLAUDE_HUB_ALLOWED_ORIGINS=http://localhost:5173
      # Inside the container network uvicorn must bind 0.0.0.0; the real
      # exposure boundary is the published host port below. Configure Feishu
      # OAuth before exposing that port beyond the local Docker host.
      - CLAUDE_HUB_ALLOW_INSECURE_LISTEN=1
    # Load Settings env vars (ANTHROPIC_API_KEY, DATABASE_URL, etc.)
    # from the repo root .env file (add vars locally; never commit secrets).
    env_file: ../.env
    # Persist tabs.json, workspace state, and tmux sockets across container
    # restarts. Without this, state is wiped every `docker compose up`.
    volumes:
      - claude_hub_state:/root/.claude_hub
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8173/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    # TODO(prod): `pnpm preview` is the Vite dev-mode preview server, not a
    #   production-grade static host. For a real deployment replace this with
    #   a multi-stage build that copies the dist/ output into an Nginx (or
    #   Caddy) container and serves it there — this also lets the reverse
    #   proxy terminate TLS, inject security headers, and route /api to the
    #   backend service over the compose network instead of via host ports.

volumes:
  # Named volume for persistent claude_hub runtime state.
  claude_hub_state:
