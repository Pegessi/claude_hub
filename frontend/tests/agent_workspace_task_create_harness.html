<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Workspace Task create harness</title>
    <style>
      :root {
        --ch-color-app-bg: #f5f6f8;
        --ch-color-surface-raised: #fff;
        --ch-color-surface-control: #f3f4f6;
        --ch-color-surface-control-hover: #eceef1;
        --ch-color-surface-glass: #fff;
        --ch-color-border-muted: #d5d7da;
        --ch-color-border-hover: #aeb3ba;
        --ch-color-border-strong: #8c929b;
        --ch-color-text: #24292f;
        --ch-color-text-strong: #111418;
        --ch-color-text-muted: #626971;
        --ch-color-success: #087f5b;
        --ch-color-danger: #c92a2a;
        --ch-color-warning: #a15c00;
        --ch-radius-sm: 5px;
        --ch-radius-md: 8px;
        --ch-radius-lg: 8px;
        --ch-color-surface: #fbfbfa;
        --ch-color-surface-soft: #f0f0ee;
        --ch-color-surface-sunken: #eeeeec;
        --ch-color-surface-pressed: #d6d6d2;
        --ch-color-border: #e0e0dc;
        --ch-color-overlay: rgba(24, 24, 24, 0.4);
        --ch-color-text-soft: #787872;
        --ch-color-text-inverse: #ffffff;
        --ch-color-accent: #4a8ce0;
        --ch-color-accent-hover: #2a6cc0;
        --ch-color-accent-strong: #3a7cd0;
        --ch-color-accent-ring: rgba(74, 140, 224, 0.16);
        --ch-shadow-button: 0 1px 2px rgba(0, 0, 0, 0.06);
        --ch-shadow-button-primary: 0 1px 4px rgba(74, 140, 224, 0.25);
        --ch-shadow-dialog: 0 20px 60px rgba(24, 24, 24, 0.12);
        --ch-font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ch-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --ch-font-size-xs: 11px;
        --ch-font-size-sm: 12px;
        --ch-font-size-base: 13px;
        --ch-font-size-md: 13px;
        --ch-shadow-soft: 0 8px 24px rgb(0 0 0 / 12%);
        --ch-motion-fast: 120ms;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #app { height: 100%; overflow: hidden; }
      body {
        background: var(--ch-color-app-bg);
        color: var(--ch-color-text);
        font-family: var(--ch-font-sans);
        font-size: var(--ch-font-size-base);
        line-height: 1.45;
        letter-spacing: -0.01em;
      }
      button, input, select, textarea { font: inherit; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from 'vue'
      import { createPinia } from 'pinia'
      import AgentWorkspaceView from '/src/components/AgentWorkspaceView.vue'

      window.__claudeHub = {}
      const app = createApp(AgentWorkspaceView)
      app.use(createPinia())
      app.mount('#app')
      window.__AGENT_WORKSPACE_TEST__ = { app }
    </script>
  </body>
</html>
