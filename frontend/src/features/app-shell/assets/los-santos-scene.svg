<!-- Original static SVG scene illustration authored for Claude Hub (los-santos palette).
     Subject: Grand Theft Auto V stylized triptych & HUD composition — three distinct protagonist
     silhouettes (left: square-jawed swept-hair figure in aviator sunglasses and structured
     open-collar suit with Maze Bank Tower; center: close-fade figure with boxed goatee and
     broad hooded sweatshirt alongside a Rottweiler companion below legible VINEWOOD hillside
     lettering; right: gaunt angular figure with receding hairline, side tufts, deep scowl, and
     worn V-neck tee beside a circular 4-sector radial character-switch wheel and tri-color bar).
     Attenuation: one root drawing group keeps the scene subordinate to readable text.
     Visibility and salience are checked in rendered app viewports, not inferred from opacity. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <g opacity="0.29">
    <!-- OUTER LEFT & RIGHT FLANKS: Downtown Maze Bank Skyline & Del Perro Pier / Palms -->
    <g fill="#3d546e" stroke="#479bc9" stroke-width="2" stroke-linejoin="round">
      <!-- Left skyline & stepped Maze Bank crown tower (x=42..202, y=88..316) -->
      <rect x="42" y="168" width="42" height="148" />
      <rect x="94" y="118" width="54" height="198" stroke="#72bce0" stroke-width="2.2" />
      <rect x="104" y="102" width="34" height="16" stroke="#72bce0" />
      <polygon points="110,102 121,88 132,102" fill="#479bc9" />
      <rect x="158" y="152" width="44" height="164" />

      <!-- Right Del Perro Ferris wheel & coastal palms (x=1016..1154, y=122..316) -->
      <circle cx="1054" cy="242" r="38" fill="#4a627d" stroke="#d6a052" stroke-width="2.4" />
      <circle cx="1054" cy="242" r="24" stroke="#72bce0" stroke-width="1.6" stroke-dasharray="5 4" />
      <path d="M1032 314 L1054 242 L1076 314" stroke="#d6a052" stroke-width="2.4" />
      <path d="M1134 314 Q1122 232 1098 152" stroke="#3da876" stroke-width="4" stroke-linecap="round" />
      <path d="M1098 152 Q1064 136 1044 156 M1098 152 Q1132 134 1154 156 M1098 152 Q1074 122 1052 128 M1098 152 Q1124 122 1146 128"
            stroke="#68c99b" stroke-width="2.4" stroke-linecap="round" />
    </g>

    <!-- ======================================================================
         PANEL 1 (LEFT-CENTER, x=214..462, y=172..316):
         Square-jawed, swept-hair, aviator-sunglasses & structured tailored suit
         ====================================================================== -->
    <g>
      <polygon points="228,172 462,172 444,316 214,316" fill="#3d546e" stroke="#479bc9" stroke-width="2.2" />
      <!-- Stepped Maze Bank silhouette in left background -->
      <path d="M234 314 V196 L250 184 L266 196 V314" fill="#4a627d" stroke="#72bce0" stroke-width="1.5" />

      <g transform="translate(354, 244)" stroke-linejoin="round" stroke-linecap="round">
        <!-- Structured angular padded suit shoulders & tailored jacket (distinct from rounded hoodie) -->
        <path d="M-76 72 L-68 14 L-24 -6 L24 -6 L68 14 L76 72 Z"
              fill="#4a627d" stroke="#72bce0" stroke-width="2.2" />
        <!-- Peaked suit lapels & open-collar dress shirt (no tie) -->
        <polygon points="-24,-6 -36,14 -12,48 0,48 -14,-6" fill="#3d546e" stroke="#72bce0" stroke-width="1.7" />
        <polygon points="24,-6 36,14 12,48 0,48 14,-6" fill="#3d546e" stroke="#72bce0" stroke-width="1.7" />
        <polygon points="-14,-6 -6,28 0,46 6,28 14,-6" fill="#479bc9" stroke="#72bce0" stroke-width="1.6" />
        <!-- Breast pocket square -->
        <polygon points="26,24 42,19 40,28 24,28" fill="#72bce0" />

        <!-- Neck & wide chiseled square jawline -->
        <rect x="-11" y="-14" width="22" height="10" fill="#4a627d" />
        <path d="M-24 -48 L-24 -22 L-16 -8 L0 -6 L16 -8 L24 -22 L24 -48 Z"
              fill="#4a627d" stroke="#72bce0" stroke-width="2.2" />
        <!-- Ears -->
        <path d="M-24 -40 L-28 -36 L-24 -26 M24 -40 L28 -36 L24 -26" stroke="#72bce0" stroke-width="1.8" />
        <!-- Voluminous side-parted swept-back hair crest (asymmetric high left part) -->
        <path d="M-26 -44 C-28 -64 -14 -72 8 -70 C24 -68 28 -58 26 -42 C18 -53 2 -56 -12 -51 L-24 -42 Z"
              fill="#3d546e" stroke="#72bce0" stroke-width="2" />
        <path d="M-14 -60 C-2 -64 12 -62 20 -55" stroke="#479bc9" stroke-width="1.6" />
        <!-- Teardrop dual-bridge aviator sunglasses with lens reflection -->
        <path d="M-20 -42 H-3 L-4 -31 C-9 -29 -18 -31 -20 -36 Z" fill="#3d546e" stroke="#72bce0" stroke-width="2" />
        <path d="M3 -42 H20 L20 -36 C18 -31 9 -29 4 -31 Z" fill="#3d546e" stroke="#72bce0" stroke-width="2" />
        <line x1="-4" y1="-41" x2="4" y2="-41" stroke="#72bce0" stroke-width="2" />
        <line x1="-15" y1="-34" x2="-9" y2="-39" stroke="#72bce0" stroke-width="1.5" />
        <line x1="8" y1="-34" x2="14" y2="-39" stroke="#72bce0" stroke-width="1.5" />
        <!-- Nose bridge, nasolabial creases & firm set mouth -->
        <path d="M0 -39 V-23 L-3 -22 M-13 -21 L-9 -14 M13 -21 L9 -14 M-8 -15 L0 -16 L8 -15"
              stroke="#72bce0" stroke-width="1.8" />
      </g>
    </g>

    <!-- ======================================================================
         PANEL 2 (CENTER, x=458..738, y=172..316):
         Legible VINEWOOD sign, close-fade broad hoodie profile + Chop Rottweiler
         ====================================================================== -->
    <g>
      <polygon points="476,172 738,172 720,316 458,316" fill="#3d546e" stroke="#3da876" stroke-width="2.2" />

      <!-- Keep the sign above Chop, clear of the central portrait (x=604..712, y=177..194). -->
      <g transform="translate(126, 0)" stroke="#68c99b" stroke-width="2.1" stroke-linecap="square" stroke-linejoin="miter" fill="none">
        <!-- V -->
        <polyline points="481,179 485,190 489,179" />
        <!-- I -->
        <line x1="494" y1="179" x2="494" y2="190" />
        <!-- N -->
        <polyline points="500,190 500,179 507,190 507,179" />
        <!-- E -->
        <path d="M518 179 H512 V190 H518 M512 184.5 H517" />
        <!-- W -->
        <polyline points="523,179 525.5,190 529,181 532.5,190 535,179" />
        <!-- O -->
        <rect x="540" y="179" width="7.5" height="11" rx="1.5" />
        <!-- O -->
        <rect x="552" y="179" width="7.5" height="11" rx="1.5" />
        <!-- D -->
        <path d="M564 179 H568.5 C571 179 572 181 572 184.5 C572 188 571 190 568.5 190 H564 Z" />
        <!-- Hillside ridge line under sign -->
        <path d="M477 193 Q526 190 577 193" stroke="#3da876" stroke-width="1.6" />
      </g>

      <!-- Broad-shouldered hooded figure with close-fade & boxed goatee (x=478..630, y=176..316) -->
      <g transform="translate(556, 244)" stroke-linejoin="round" stroke-linecap="round">
        <!-- Broad athletic sloped shoulders & heavy bunched hoodie silhouette -->
        <path d="M-78 72 C-74 32 -58 6 -34 -4 L34 -4 C58 6 74 32 78 72 Z"
              fill="#4a627d" stroke="#68c99b" stroke-width="2.2" />
        <!-- Thick layered hood collar bunched around neck -->
        <path d="M-38 -2 C-32 -16 -18 -18 0 -14 C18 -18 32 -16 38 -2 C28 14 -28 14 -38 -2 Z"
              fill="#3d546e" stroke="#68c99b" stroke-width="2" />
        <!-- Center zip seam, drawstrings & chain -->
        <line x1="0" y1="10" x2="0" y2="70" stroke="#3da876" stroke-width="1.6" />
        <line x1="-11" y1="8" x2="-11" y2="38" stroke="#68c99b" stroke-width="2.2" />
        <line x1="11" y1="8" x2="11" y2="38" stroke="#68c99b" stroke-width="2.2" />
        <path d="M-16 4 Q0 20 16 4" stroke="#d6a052" stroke-width="1.8" />

        <!-- Tapered athletic jaw, ears & tight high-and-tight fade haircut -->
        <path d="M-20 -50 L-20 -26 C-20 -14 -12 -6 0 -6 C12 -6 20 -14 20 -26 L20 -50 Z"
              fill="#4a627d" stroke="#68c99b" stroke-width="2.2" />
        <path d="M-20 -38 L-24 -35 L-20 -26 M20 -38 L24 -35 L20 -26" stroke="#68c99b" stroke-width="1.8" />
        <!-- Flat-top close temple fade hairline -->
        <path d="M-20 -48 L-19 -63 C-10 -67 10 -67 19 -63 L20 -48 C11 -53 -11 -53 -20 -48 Z"
              fill="#3d546e" stroke="#68c99b" stroke-width="2" />
        <!-- Brows, eyes, broader nose & sculpted boxed goatee -->
        <path d="M-14 -40 L-4 -39 M4 -39 L14 -40" stroke="#68c99b" stroke-width="2.2" />
        <circle cx="-8.5" cy="-34" r="2" fill="#68c99b" />
        <circle cx="8.5" cy="-34" r="2" fill="#68c99b" />
        <path d="M0 -34 V-24 M-4 -23 H4" stroke="#68c99b" stroke-width="1.8" />
        <path d="M-8 -19 H8 L7 -8 C3 -6 -3 -6 -7 -8 Z" fill="#3d546e" stroke="#68c99b" stroke-width="1.8" />
        <line x1="-4" y1="-14" x2="4" y2="-14" stroke="#68c99b" stroke-width="1.6" />
      </g>

      <!-- Chop the Rottweiler (x=634..720, y=204..316) -->
      <g transform="translate(676, 260)" stroke-linejoin="round" stroke-linecap="round">
        <!-- Broad Rottweiler chest, forelegs & rust-tan chest markings -->
        <path d="M-31 56 C-33 26 -22 6 0 6 C22 6 33 26 31 56 Z"
              fill="#3d546e" stroke="#68c99b" stroke-width="2" />
        <path d="M-16 20 L0 28 L16 20 L11 40 L0 46 L-11 40 Z" fill="#cc8433" />
        <!-- Heavy gold/amber chain collar -->
        <path d="M-21 8 Q0 17 21 8" stroke="#d6a052" stroke-width="3.4" stroke-dasharray="4 3" />
        <!-- Broad Rottweiler skull, drop ears, tan brow pips & tapered muzzle/jowls -->
        <path d="M-19 -20 C-18 -34 18 -34 19 -20 L21 -2 C21 8 11 11 0 11 C-11 11 -21 8 -21 -2 Z"
              fill="#4a627d" stroke="#68c99b" stroke-width="2" />
        <polygon points="-18,-24 -30,-8 -18,-4" fill="#3d546e" stroke="#68c99b" stroke-width="1.7" />
        <polygon points="18,-24 30,-8 18,-4" fill="#3d546e" stroke="#68c99b" stroke-width="1.7" />
        <circle cx="-7.5" cy="-15" r="2.4" fill="#d6a052" />
        <circle cx="7.5" cy="-15" r="2.4" fill="#d6a052" />
        <path d="M-11 -7 C-8 -11 8 -11 11 -7 L9 5 C4 8 -4 8 -9 5 Z"
              fill="#3d546e" stroke="#d6a052" stroke-width="1.6" />
        <path d="M-3 -4 H3 L0 -1 Z" fill="#d6a052" />
      </g>
    </g>

    <!-- ======================================================================
         PANEL 3 (RIGHT-CENTER, x=734..986, y=172..316):
         Gaunt angular receding-hair figure in worn V-neck & radial 4-sector switch wheel
         ====================================================================== -->
    <g>
      <polygon points="752,172 986,172 968,316 734,316" fill="#3d546e" stroke="#cc8433" stroke-width="2.2" />

      <g transform="translate(830, 244)" stroke-linejoin="round" stroke-linecap="round">
        <!-- Gaunt, narrower asymmetric slouched shoulders & sagging stretched V-neck tee -->
        <path d="M-64 72 L-56 20 L-34 2 L-16 -6 L18 -4 L38 6 L56 24 L62 72 Z"
              fill="#4a627d" stroke="#d6a052" stroke-width="2.2" />
        <!-- Deep sagging V-neck collar & exposed clavicles/neck tattoo -->
        <polygon points="-20,-6 0,28 20,-4 12,-6 0,14 -12,-6" fill="#3d546e" stroke="#d6a052" stroke-width="1.8" />
        <path d="M-11 -2 Q0 4 11 -2" stroke="#d6a052" stroke-width="1.6" stroke-dasharray="3 2" />
        <path d="M-38 22 L-18 32 M36 24 L18 34 M-28 46 L-10 52" stroke="#d6a052" stroke-width="1.6" />

        <!-- Gaunt angular skull with hollow cheeks, narrow pointed chin & bare high forehead dome -->
        <path d="M-18 -50 C-17 -68 17 -68 18 -50 L20 -36 L14 -19 L6 -6 L-6 -6 L-14 -19 L-20 -36 Z"
              fill="#4a627d" stroke="#d6a052" stroke-width="2.2" />
        <!-- Jagged filled unkempt side hair tufts jutting from temples around bare crown -->
        <polygon points="-18,-38 -31,-45 -23,-51 -29,-59 -16,-54" fill="#3d546e" stroke="#d6a052" stroke-width="1.9" />
        <polygon points="18,-38 31,-45 23,-51 29,-59 16,-54" fill="#3d546e" stroke="#d6a052" stroke-width="1.9" />
        <!-- Hollow cheekbone creases, deep V-scowl brow, wide eyes, crooked nose & scruffy moustache/stubble -->
        <path d="M-15 -42 L-3 -35 M15 -42 L3 -35" stroke="#d6a052" stroke-width="2.5" />
        <circle cx="-8" cy="-32" r="2.1" fill="#d6a052" />
        <circle cx="8" cy="-32" r="2.1" fill="#d6a052" />
        <path d="M0 -34 L-2 -23 L2 -22 M-14 -28 L-10 -18 M14 -28 L10 -18" stroke="#d6a052" stroke-width="1.7" />
        <path d="M-9 -15 L-3 -18 L0 -17 L3 -18 L9 -15" stroke="#d6a052" stroke-width="2.1" />
      </g>

      <!-- Subordinate Circular 4-Sector Radial Character-Switch Wheel & Tri-Segment Bar (cx=932, cy=214) -->
      <g transform="translate(932, 214)">
        <circle cx="0" cy="0" r="26" fill="#3d546e" stroke="#72bce0" stroke-width="1.6" />
        <!-- 4 radial wedge sectors: Top (green), Left (blue), Right (amber), Bottom (slate) -->
        <path d="M-16 -16 A22.6 22.6 0 0 1 16 -16 L6 -6 A8.5 8.5 0 0 0 -6 -6 Z"
              fill="#3da876" stroke="#68c99b" stroke-width="1.4" />
        <path d="M-16 16 A22.6 22.6 0 0 1 -16 -16 L-6 -6 A8.5 8.5 0 0 0 -6 6 Z"
              fill="#479bc9" stroke="#72bce0" stroke-width="1.4" />
        <path d="M16 -16 A22.6 22.6 0 0 1 16 16 L6 6 A8.5 8.5 0 0 0 6 -6 Z"
              fill="#cc8433" stroke="#d6a052" stroke-width="1.4" />
        <path d="M16 16 A22.6 22.6 0 0 1 -16 16 L-6 6 A8.5 8.5 0 0 0 6 6 Z"
              fill="#4a627d" stroke="#72bce0" stroke-width="1.4" />
        <circle cx="0" cy="0" r="6" fill="#3d546e" stroke="#d6a052" stroke-width="1.4" />
        <!-- Tri-segment HUD health/armor/special bar under wheel -->
        <rect x="-24" y="32" width="22" height="4.5" fill="#3da876" />
        <rect x="0" y="32" width="13" height="4.5" fill="#479bc9" />
        <rect x="15" y="32" width="9" height="4.5" fill="#d6a052" />
      </g>
    </g>
  </g>
</svg>
