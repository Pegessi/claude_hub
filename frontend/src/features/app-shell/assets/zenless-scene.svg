      <ellipse cx="25" cy="58" rx="16" ry="6.5" fill="#59473a" stroke="#b89f88" stroke-width="2" />

      <!-- Eous Cropped Dark Staff Vest & Stubby Arms -->
      <path d="M-60 12 C-64 -12 -50 -38 -32 -44 L32 -44 C50 -38 64 -12 60 12 L48 30 C30 35 16 36 8 32 L5 10 L-5 10 L-8 32 C-16 36 -30 35 -48 30 Z"
            fill="#59473a" stroke="#b89f88" stroke-width="2.2" />
      <path d="M-56 -10 C-74 0 -78 20 -64 28 C-56 31 -50 20 -52 6 Z"
