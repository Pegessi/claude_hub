<!-- Original static SVG scene illustration authored for Claude Hub (zenless palette).
     Subject: Eous (伊埃斯, Bangboo No. 01 — pear-shaped body, mismatched rabbit ears with
     pivot bolts, rounded oval CRT visor with glowing circular LED eyes, cropped staff vest,
     and red-orange '01' neckerchief) in the Random Play video store / H.D.D. multi-monitor
     workbench with Fairy's camera-lens iris and Bangboo 18.
     Attenuation: one root drawing group keeps the scene subordinate to readable text.
     Visibility and salience are checked in rendered app viewports, not inferred from opacity. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <g opacity="0.29">
    <!-- Soft ambient horizon band across lower timeline (y=176..320) -->
    <path d="M40 318 C180 218 420 194 600 194 C780 194 1020 218 1160 318 Z" fill="#59473a" />

    <!-- OUTER LEFT & RIGHT FLANKS: Random Play VHS Archive Shelving (visible on wide desktop & empty states) -->
    <g fill="#59473a" stroke="#9e826b" stroke-width="2">
      <!-- Left VHS rack (x=42..186, y=118..314) -->
      <rect x="42" y="118" width="144" height="196" rx="6" />
      <line x1="42" y1="164" x2="186" y2="164" />
      <line x1="42" y1="212" x2="186" y2="212" />
      <line x1="42" y1="260" x2="186" y2="260" />
      <rect x="58" y="128" width="16" height="30" rx="2" fill="#d4682a" />
      <rect x="80" y="128" width="16" height="30" rx="2" fill="#b89f88" />
      <rect x="102" y="128" width="16" height="30" rx="2" fill="#634f40" />
