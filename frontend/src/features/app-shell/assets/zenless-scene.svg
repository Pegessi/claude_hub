      <!-- Fairy waveform bars -->
      <path d="M-62 -4 H-38 M38 -4 H62 M0 -42 V-36 M0 28 V34" stroke="#6cb2d6" stroke-width="2.2" stroke-linecap="round" />
      <rect x="-64" y="-42" width="34" height="8" rx="2" fill="#d4682a" />
