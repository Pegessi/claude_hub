      <rect x="88" y="222" width="18" height="32" rx="2" fill="#d4682a" />

      <!-- Right VHS rack (x=1014..1158, y=118..314) -->
      <rect x="1014" y="118" width="144" height="196" rx="6" />
      <line x1="1014" y1="164" x2="1158" y2="164" />
      <line x1="1014" y1="212" x2="1158" y2="212" />
      <line x1="1014" y1="260" x2="1158" y2="260" />
      <rect x="1030" y="128" width="16" height="30" rx="2" fill="#ccb59e" />
      <rect x="1052" y="128" width="16" height="30" rx="2" fill="#d4682a" />
      <rect x="1096" y="174" width="16" height="32" rx="2" fill="#b89f88" />
      <rect x="1118" y="174" width="16" height="32" rx="2" fill="#d4682a" />
      <rect x="1040" y="222" width="18" height="32" rx="2" fill="#d4682a" />
