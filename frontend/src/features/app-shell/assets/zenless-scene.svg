    <!-- Twin-Reel Tape Module on Right (x=890..982, y=194..312) -->
    <g transform="translate(936, 256)">
      <rect x="-42" y="-54" width="84" height="108" rx="10" fill="#59473a" stroke="#b89f88" stroke-width="2.2" />
      <circle cx="0" cy="-20" r="21" fill="#634f40" stroke="#d4682a" stroke-width="2.6" />
      <circle cx="0" cy="-20" r="7" fill="#ccb59e" />
      <circle cx="0" cy="24" r="21" fill="#634f40" stroke="#d4682a" stroke-width="2.6" />
