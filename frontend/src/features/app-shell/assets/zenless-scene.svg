      <path d="M-62 32 C-68 -10 -48 -54 0 -54 C48 -54 68 -10 62 32 C56 56 32 62 0 62 C-32 62 -56 56 -62 32 Z"
            fill="#ccb59e" stroke="#7a624f" stroke-width="2.6" />
      <!-- Stubby feet -->
