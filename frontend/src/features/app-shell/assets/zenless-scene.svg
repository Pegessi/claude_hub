<!-- Original static SVG scene illustration authored for Claude Hub (zenless palette).
     Motif: Orange/obsidian analog electronics, CRT monitor stack, twin-reel cassette
     silhouette, comic halftones, cut-paper stickers, and industrial street signage.
     No third-party logos, proprietary fonts, or external asset dependencies. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <defs>
    <pattern id="zzz-dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
      <circle cx="4" cy="4" r="1.8" fill="#ff6f0f" fill-opacity="0.32" />
      <circle cx="11" cy="11" r="1.1" fill="#ff9a3d" fill-opacity="0.22" />
    </pattern>
    <pattern id="zzz-hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="28" fill="#ff6f0f" />
      <rect x="14" width="14" height="28" fill="#14100d" />
    </pattern>
    <pattern id="zzz-scan" width="8" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="8" y2="2" stroke="#ff8533" stroke-width="1" stroke-opacity="0.35" />
    </pattern>
    <linearGradient id="zzz-horizon-glow" x1="600" y1="20" x2="600" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6f0f" stop-opacity="0" />
      <stop offset="0.58" stop-color="#ff6f0f" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ff6f0f" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="zzz-orange-slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8c2e" />
      <stop offset="1" stop-color="#e65500" />
    </linearGradient>
  </defs>

  <!-- Ambient horizon glow & diagonal comic halftone bands -->
  <rect width="1200" height="320" fill="url(#zzz-horizon-glow)" />
  <polygon points="0,120 430,36 390,310 0,310" fill="url(#zzz-dots)" />
  <polygon points="760,24 1200,98 1200,310 710,310" fill="url(#zzz-dots)" />

  <!-- Overhead urban utility cables & signal lines -->
  <path d="M-20 74 Q 290 132 580 62 T 1220 88" stroke="#ff7a1f" stroke-width="2" stroke-opacity="0.55" fill="none" />
  <path d="M-20 92 Q 310 154 610 82 T 1220 108" stroke="#3b3028" stroke-width="2.5" stroke-opacity="0.75" fill="none" />
  <path d="M180 50 L 520 112 M 720 96 L 1060 44" stroke="#ff9a3d" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.5" />

  <!-- Background urban silhouettes (Sixth Street industrial blocks & truss towers) -->
  <g fill="#1c1613" stroke="#59493e" stroke-width="2">
    <rect x="18" y="138" width="96" height="166" rx="4" />
    <rect x="126" y="106" width="118" height="198" rx="4" />
    <rect x="256" y="152" width="84" height="152" rx="4" />
    <rect x="842" y="128" width="104" height="176" rx="4" />
    <rect x="958" y="96" width="124" height="208" rx="4" />
    <rect x="1092" y="144" width="92" height="160" rx="4" />
  </g>

  <!-- Steel signal tower & rooftop parabolic dish (left-midground) -->
  <g stroke="#ff7a1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 106 L184 42 L200 106 M172 84 H196 M176 62 H192" />
    <path d="M206 54 A 20 20 0 0 1 228 82" fill="none" stroke-width="3" />
    <line x1="214" y1="68" x2="232" y2="58" />
    <circle cx="234" cy="57" r="3.5" fill="#ff6f0f" />
  </g>

  <!-- CENTERPIECE: Giant oblique cassette-deck module & twin tape reels -->
  <g transform="translate(600, 186) rotate(-5) translate(-600, -186)">
    <!-- Hard offset comic sticker shadow -->
    <rect x="378" y="84" width="456" height="214" rx="22" fill="#0d0a08" fill-opacity="0.9" />
    <!-- Outer obsidian cassette casing with high-contrast orange frame -->
    <rect x="370" y="76" width="456" height="214" rx="22" fill="#1e1814" stroke="#ff6f0f" stroke-width="3.5" />
    <!-- Top chamfered orange header stripe & sticker tag -->
    <path d="M392 94 H804 L792 128 H384 Z" fill="url(#zzz-orange-slab)" />
    <rect x="400" y="101" width="68" height="14" rx="7" fill="#14100d" />
    <rect x="478" y="101" width="28" height="14" rx="3" fill="#fff4e8" />
    <rect x="716" y="100" width="70" height="16" rx="3" fill="#14100d" />
    <!-- Tape window bridge -->
    <rect x="412" y="140" width="372" height="98" rx="16" fill="#120e0b" stroke="#ff9a3d" stroke-width="2.5" />
    <rect x="552" y="156" width="92" height="66" rx="6" fill="#261c15" stroke="#ff6f0f" stroke-width="2" />
    <line x1="564" y1="172" x2="632" y2="172" stroke="#ff8533" stroke-width="3" />
    <line x1="564" y1="188" x2="618" y2="188" stroke="#fff4e8" stroke-width="2.5" />
    <line x1="564" y1="204" x2="626" y2="204" stroke="#ff6f0f" stroke-width="2.5" />

    <!-- Left Cassette Reel -->
    <g transform="translate(486, 189)">
      <circle r="38" fill="#1c1511" stroke="#ff6f0f" stroke-width="3.5" />
      <circle r="26" fill="#120e0b" stroke="#fff4e8" stroke-width="2" stroke-dasharray="10 6" />
      <circle r="13" fill="#ff6f0f" stroke="#14100d" stroke-width="2.5" />
      <path d="M0 -26 V-13 M0 13 V26 M-26 0 H-13 M13 0 H26 M-18 -18 L-9 -9 M9 9 L18 18" stroke="#ff9a3d" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Right Cassette Reel -->
    <g transform="translate(710, 189)">
      <circle r="38" fill="#1c1511" stroke="#ff6f0f" stroke-width="3.5" />
      <circle r="26" fill="#120e0b" stroke="#fff4e8" stroke-width="2" stroke-dasharray="10 6" />
      <circle r="13" fill="#ff6f0f" stroke="#14100d" stroke-width="2.5" />
      <path d="M0 -26 V-13 M0 13 V26 M-26 0 H-13 M13 0 H26 M-18 18 L-9 9 M9 -9 L18 -18" stroke="#ff9a3d" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Bottom trapezoid head shield -->
    <polygon points="462,288 484,252 712,252 734,288" fill="#2a211b" stroke="#ff7a1f" stroke-width="2.5" />
    <circle cx="516" cy="270" r="5" fill="#fff4e8" />
    <circle cx="680" cy="270" r="5" fill="#fff4e8" />
    <rect x="546" y="264" width="104" height="12" rx="4" fill="#ff6f0f" />
  </g>

  <!-- LEFT CLUSTER: Stacked Analog CRT Monitors & Waveform Oscilloscope -->
  <g>
    <!-- Lower Wide CRT Monitor -->
    <rect x="64" y="182" width="188" height="122" rx="14" fill="#0d0a08" />
    <rect x="58" y="176" width="188" height="122" rx="14" fill="#221b16" stroke="#ff6f0f" stroke-width="3.2" />
    <rect x="72" y="190" width="132" height="92" rx="10" fill="#140f0c" stroke="#ff9a3d" stroke-width="2" />
    <rect x="72" y="190" width="132" height="92" rx="10" fill="url(#zzz-scan)" />
    <!-- CRT Oscilloscope Signal Wave -->
    <polyline points="82,238 102,238 112,212 124,262 138,204 152,252 164,226 176,238 194,238" stroke="#ff6f0f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" fill="none" />
    <circle cx="224" cy="206" r="9" fill="#ff6f0f" stroke="#14100d" stroke-width="2" />
    <circle cx="224" cy="232" r="9" fill="#3b3028" stroke="#fff4e8" stroke-width="2" />
    <rect x="214" y="252" width="20" height="6" rx="2" fill="#ff9a3d" />
    <rect x="214" y="264" width="20" height="6" rx="2" fill="#ff9a3d" />

    <!-- Upper Tilted Street-Pop CRT TV (Bangboo-inspired analog monitor head) -->
    <g transform="translate(174, 128) rotate(6) translate(-174, -128)">
      <rect x="112" y="78" width="136" height="98" rx="18" fill="#0d0a08" />
      <rect x="106" y="72" width="136" height="98" rx="18" fill="#ff6f0f" stroke="#14100d" stroke-width="3.5" />
      <rect x="118" y="84" width="112" height="74" rx="12" fill="#16110e" stroke="#fff4e8" stroke-width="2.2" />
      <!-- Dual circular CRT eyes & signal grin -->
      <circle cx="150" cy="116" r="13" fill="#ff6f0f" />
      <circle cx="150" cy="116" r="5" fill="#fff4e8" />
      <circle cx="198" cy="116" r="13" fill="#ff6f0f" />
      <circle cx="198" cy="116" r="5" fill="#fff4e8" />
      <path d="M158 140 H190" stroke="#fff4e8" stroke-width="3.5" stroke-linecap="round" />
      <!-- V-Antenna ears -->
      <path d="M148 72 L128 38 M196 72 L218 34" stroke="#ff6f0f" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="128" cy="38" r="5" fill="#fff4e8" stroke="#14100d" stroke-width="2" />
      <circle cx="218" cy="34" r="5" fill="#ff6f0f" stroke="#14100d" stroke-width="2" />
    </g>

    <!-- Cut-paper lightning sticker badge -->
    <polygon points="312,126 284,174 308,174 294,218 344,162 318,162" fill="#fff4e8" stroke="#14100d" stroke-width="3" />
    <polygon points="308,122 280,170 304,170 290,214 340,158 314,158" fill="#ff6f0f" stroke="#14100d" stroke-width="2.5" />
  </g>

  <!-- RIGHT CLUSTER: Industrial Exhaust Turbine, VHS Rack & Cut-Paper Signage -->
  <g>
    <!-- Industrial Fan Housing -->
    <rect x="882" y="156" width="144" height="142" rx="16" fill="#0d0a08" />
    <rect x="876" y="150" width="144" height="142" rx="16" fill="#211a15" stroke="#ff6f0f" stroke-width="3.2" />
    <circle cx="948" cy="221" r="52" fill="#120e0b" stroke="#ff9a3d" stroke-width="2.5" />
    <!-- 6-Blade Turbine Silhouette -->
    <g transform="translate(948, 221)" fill="#ff6f0f" stroke="#14100d" stroke-width="1.8">
      <path d="M0 0 L-14 -44 L12 -44 Z" />
      <path d="M0 0 L44 -14 L34 14 Z" />
      <path d="M0 0 L28 38 L0 46 Z" />
      <path d="M0 0 L-28 38 L-42 14 Z" />
      <path d="M0 0 L-44 -14 L-24 -38 Z" />
      <circle r="14" fill="#fff4e8" stroke="#14100d" stroke-width="3" />
      <circle r="5" fill="#14100d" />
    </g>

    <!-- Tilted Street-Pop Warning Sign & VHS Spines -->
    <g transform="translate(1086, 196) rotate(-7) translate(-1086, -196)">
      <rect x="1038" y="118" width="108" height="168" rx="14" fill="#0d0a08" />
      <rect x="1032" y="112" width="108" height="168" rx="14" fill="#ff6f0f" stroke="#14100d" stroke-width="3.5" />
      <rect x="1046" y="128" width="80" height="26" rx="6" fill="#14100d" />
      <circle cx="1062" cy="141" r="6" fill="#ff6f0f" />
      <rect x="1076" y="137" width="38" height="8" rx="3" fill="#fff4e8" />
      <rect x="1046" y="166" width="80" height="18" rx="4" fill="#fff4e8" stroke="#14100d" stroke-width="2" />
      <rect x="1046" y="192" width="80" height="18" rx="4" fill="#1e1814" stroke="#14100d" stroke-width="2" />
      <rect x="1046" y="218" width="80" height="18" rx="4" fill="#fff4e8" stroke="#14100d" stroke-width="2" />
      <polygon points="1056,262 1116,262 1086,242" fill="#14100d" />
    </g>
  </g>

  <!-- Bottom Full-Width Industrial Caution Plinth -->
  <rect x="0" y="296" width="1200" height="24" fill="url(#zzz-hazard)" />
  <line x1="0" y1="296" x2="1200" y2="296" stroke="#ff6f0f" stroke-width="3" />
  <line x1="0" y1="319" x2="1200" y2="319" stroke="#14100d" stroke-width="2" />
</svg>
