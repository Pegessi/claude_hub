      <!-- Random Play staff pocket patch -->
      <rect x="-42" y="16" width="22" height="8" rx="2" fill="#d4682a" />

      <!-- Eous Rounded-Oval CRT Visor Faceplate & Glowing Circular LED Eyes (viewBox y=206..248) -->
      <rect x="-42" y="-46" width="84" height="44" rx="21" fill="#59473a" stroke="#ccb59e" stroke-width="2.4" />
