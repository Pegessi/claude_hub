      <circle cx="-17" cy="-25" r="10" fill="#634f40" stroke="#d4682a" stroke-width="3.4" />
      <circle cx="-17" cy="-25" r="4.2" fill="#d6984b" />
      <!-- Right Circular LED Eye -->
      <circle cx="17" cy="-25" r="10" fill="#634f40" stroke="#d4682a" stroke-width="3.4" />
      <circle cx="17" cy="-25" r="4.2" fill="#d6984b" />
      <!-- Expressive visor smile arc -->
