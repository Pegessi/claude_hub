      <ellipse cx="0" cy="58" rx="86" ry="11" fill="#634f40" stroke="#d4682a" stroke-width="2" stroke-dasharray="10 5" />

      <!-- Eous Left Ear (Sand/cream shell + orange inner groove + pivot bolt, y=-86..-34 => viewBox y=166..218) -->
      <g transform="translate(-28, -42) rotate(-10)">
